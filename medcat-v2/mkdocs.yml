# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: MedCAT Documentation
site_url: https://docs.cogstack.org/

theme:
  name: material
  favicon: _static/img/cat-logo.svg
  logo: _static/img/cat-logo.svg
  icon:
    logo:  _static/img/cat-logo.svg
  palette:
    primary: white

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.footer
    - header.autohide
    - content.tooltips
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - attr_list

repo_url: https://github.com/CogStack/cogstack-nlp
repo_name: cogstack-nlp

docs_dir: docs

nav:
  - Home: main.md
  - Architecture: architecture.md
  - Migration guide (v2): migration_guide_v2.md
  - Breaking changes: breaking_changes.md

plugins:
  - search
  - termynal

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
