# Dev compose yml file for building, running and mounting local git cloned repo.

services:
  medcattrainer:
    build:
      network: host
      context: ./webapp
      args:
        SPACY_MODELS: ${SPACY_MODELS:-en_core_web_md}
    restart: always
    networks:
      - gateway-auth_gateway-net
    volumes:
      - api-media:/home/api/media
      - api-static:/home/api/static
      - api-db:/home/api/db
      - api-db-backup:/home/api/db-backup
      - ./webapp/api/core:/home/api/core
      - ./webapp/api/api:/home/api/api
      - ./webapp/scripts:/home/scripts
      - ./configs:/home/configs
      - ./supervisord.conf:/etc/supervisord.conf
    env_file:
      - ./envs/env
    environment:
      - MCT_VERSION=latest
      - MCT_DEV_LIVERELOAD=1
      - REMOTE_MODEL_SERVICE_TYPE=medcat
      # OIDC Settings
      - USE_OIDC=0
      - KEYCLOAK_URL=http://keycloak.cogstack.localhost
      - KEYCLOAK_REALM=cogstack-realm
      - KEYCLOAK_FRONTEND_CLIENT_ID=cogstack-medcattrainer-frontend
      - KEYCLOAK_LOGOUT_REDIRECT_URI=http://launch.cogstack.localhost/
      - KEYCLOAK_INTERNAL_SERVICE_URL=http://keycloak:8080
      - KEYCLOAK_BACKEND_CLIENT_ID=cogstack-medcattrainer-backend
      - KEYCLOAK_BACKEND_CLIENT_SECRET=***
      - MCT_ENABLE_TRACING=True
      # OpenTelemetry settings
      
      # OTLP HTTP (port 4318); use http/protobuf — grpc can trigger "Unsupported OTLP protocol" in this stack
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_SERVICE_NAME=medcat-trainer
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_PYTHON_DJANGO_EXCLUDED_URLS=/api/health/*,/metrics
      - OTEL_EXPERIMENTAL_RESOURCE_DETECTORS=containerid,os
    command: /usr/bin/supervisord -c /etc/supervisord.conf

  nginx:
    image: nginx
    restart: always
    volumes:
      - api-media:/home/api/media
      - api-static:/home/api/static
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/sites-enabled/:/etc/nginx/sites-enabled
    networks:
      - gateway-auth_gateway-net
    env_file:
      - ./envs/env
    ports:
      - ${MCTRAINER_PORT:-8001}:8000
    depends_on:
      - medcattrainer
      - solr
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx.rule=Host(`${NGINX_HOST:-medcattrainer.cogstack.localhost}`)"
      - "traefik.http.routers.nginx.entrypoints=web"
      - "traefik.http.services.nginx.loadbalancer.server.port=8000"

  solr:
    container_name: mct_solr
    image: solr:8
    restart: always
    env_file:
      - ./envs/env
    ports:
      - ${SOLR_PORT:-8983}:8983
    volumes:
      - solr-data:/var/solr
    networks:
      - gateway-auth_gateway-net
    command:
      - -cloud

volumes:
  api-media:
  api-static:
  api-db:
  api-db-backup:
  solr-data:

networks:
  gateway-auth_gateway-net:
    external: true

