name: MedCAT-nightly-stability-check
permissions:
  contents: read
on:
  schedule:
    - cron: "0 3 * * *"  # every day at 3am UTC
  workflow_dispatch:     # allow manual runs
  push:
    paths:
      - ".github/workflows/medcat-v2-lib-stabiliy.yml"
  pull_request:
    paths:
      - ".github/workflows/medcat-v2-lib-stabiliy.yml"

defaults:
  run:
    working-directory: ./medcat-v2


jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.9, 3.10, 3.11, 3.12]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install with latest deps
        run: |
          uv sync --all-extras --dev
          uv run python -m ensurepip
          uv run python -m pip install --upgrade pip

      - name: Check types
        run: |
          uv run python -m mypy --follow-imports=normal medcat

      - name: Ruff linting
        run: |
          uv run ruff check medcat --preview

      - name: Test
        run: |
          timeout 30m uv run python -m unittest discover

      - name: Model regression
        run: |
          uv run bash tests/backwards_compatibility/run_current.sh
